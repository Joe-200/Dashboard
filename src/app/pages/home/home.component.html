<div class="app-shell" [class.is-collapsed]="collapsed">

  <!-- ============================================================
       SIDEBAR
  ============================================================ -->
  <aside class="sidebar" id="app-sidebar" aria-label="Primary navigation">

    <!-- Brand -->
    <div class="sidebar__brand">
      <a class="brand-mark" routerLink="/calendar" aria-label="Luxury Hotel home"
         [attr.title]="collapsed ? 'Luxury Hotel' : null">
        <span aria-hidden="true">H</span>
      </a>
      <div class="brand-text">
        <span class="brand-name">Luxury Hotel</span>
        <span class="brand-tenant">MANAGEMENT</span>
      </div>
    </div>

    <!-- Primary nav -->
    <nav class="sidebar__nav" aria-label="Sections">
      <a class="nav-item" routerLink="/reservations"
         routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }"
         [attr.title]="collapsed ? 'Reservations' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
        <span class="nav-item__label">Reservations</span>
      </a>

      <a class="nav-item" routerLink="/calendar"
         routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }"
         [attr.title]="collapsed ? 'Calendar' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span class="nav-item__label">Calendar</span>
      </a>

      <a class="nav-item" routerLink="/rooms"
         routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }"
         [attr.title]="collapsed ? 'Rooms' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/>
          <path d="M2 15h20"/>
          <path d="M6 10V7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>
          <path d="M12 10V7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>
        </svg>
        <span class="nav-item__label">Rooms</span>
      </a>

      <a class="nav-item" routerLink="/guests"
         routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }"
         [attr.title]="collapsed ? 'Guests' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-item__label">Guests</span>
      </a>

      <a class="nav-item" routerLink="/special-offers"
         routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }"
         [attr.title]="collapsed ? 'Offers' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        <span class="nav-item__label">Offers</span>
      </a>

      <a class="nav-item" routerLink="/ai"
         routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }"
         [attr.title]="collapsed ? 'AI Assistant' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="nav-item__label">AI Assistant</span>
      </a>
    </nav>

    <!-- Bottom section -->
    <div class="sidebar__footer">

      <!-- Minimize / maximize (directly above Settings) -->
      <button type="button" class="nav-item nav-item--button"
              (click)="toggleSidebar()"
              [attr.aria-expanded]="!collapsed"
              aria-controls="app-sidebar"
              [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
              [attr.title]="(collapsed ? 'Expand sidebar' : 'Collapse sidebar') + ' (Ctrl/⌘ + B)'">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="collapsed ? 'M13 17l5-5-5-5M6 17l5-5-5-5' : 'M11 17l-5-5 5-5M18 17l-5-5 5-5'"/>
        </svg>
        <span class="nav-item__label">Minimize</span>
      </button>

      <a class="nav-item" routerLink="/settings"
         routerLinkActive="is-active"
         [attr.title]="collapsed ? 'Settings' : null">
        <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="nav-item__label">Settings</span>
      </a>

      <!-- Account + logout -->
      <div class="account">
        <div class="user-card" [attr.title]="collapsed ? user?.username : null">
          <div class="user-card__avatar" aria-hidden="true">
            {{ user?.username?.charAt(0)?.toUpperCase() }}
          </div>
          <div class="user-card__info">
            <span class="user-card__name">{{ user?.username }}</span>
            <span class="user-card__role">{{ user?.role }}</span>
          </div>
        </div>

        <button type="button" class="logout-btn" (click)="logout()"
                aria-label="Log out" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" width="16" height="16">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============================================================
       MAIN AREA
  ============================================================ -->
  <main class="main-content">
    <div class="page-transition">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
