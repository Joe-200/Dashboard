<div class="app-container">

  <!-- ============================================================
       NAVBAR
  ============================================================ -->
  <nav class="dashboard-navbar" aria-label="Primary navigation">

    <!-- Brand -->
    <a class="nav-brand" routerLink="/calendar" aria-label="Luxury Hotel home">
      <div class="brand-mark" aria-hidden="true">H</div>

      <div class="brand-info">
        <span class="brand-name">Luxury Hotel</span>
        <span class="brand-label">Management</span>
      </div>
    </a>

    <!-- Nav -->
    <ul class="nav-links" role="list">
      <li>
        <a routerLink="/reservations" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          Reservations
        </a>
      </li>
      <li>
        <a routerLink="/calendar" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          Calendar
        </a>
      </li>
      <li>
        <a routerLink="/rooms" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          Rooms
        </a>
      </li>
      <li>
        <a routerLink="/guests" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          Guests
        </a>
      </li>
      <li>
        <a routerLink="/special-offers" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          Offers
        </a>
      </li>
      <li>
        <a routerLink="/ai" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          AI
        </a>
      </li>
    </ul>

    <!-- User -->
    <div class="nav-user">

      <div class="user-info">
        <span class="user-name">{{ user?.username }}</span>
        <span class="user-role">{{ user?.role }}</span>
      </div>

      <div class="user-avatar" aria-hidden="true">
        {{ user?.username?.charAt(0)?.toUpperCase() }}
      </div>

      <!-- ✅ Settings icon -->
      <a class="btn-icon"
         routerLink="/settings"
         routerLinkActive="active"
         aria-label="Settings"
         title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24"
             width="18" height="18"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>

      <button class="btn-logout" type="button" (click)="logout()">
        Logout
      </button>

    </div>

  </nav>

  <!-- ============================================================
       MAIN
  ============================================================ -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
