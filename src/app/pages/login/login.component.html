<div class="login-page">
  <div class="login-card">

    <div class="login-card__brand">
      <div class="brand-mark" aria-hidden="true">H</div>
    </div>

    <header class="login-card__header">
      <h1>Sign in to your workspace</h1>
      <p>Access the hotel management platform.</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username"
               class="input" placeholder="Enter your username"
               autocomplete="username" spellcheck="false" />
        <p class="field__error"
           *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          Username is required.
        </p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password"
                 [type]="showPassword ? 'text' : 'password'"
                 formControlName="password" class="input"
                 placeholder="Enter your password"
                 autocomplete="current-password" />
          <button type="button" class="input-toggle"
                  (click)="togglePasswordVisibility()"
                  [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                  [attr.aria-pressed]="showPassword">
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94C16.23 19.243 14.15 19.965 12 20C5 20 1 12 1 12C2.24 9.68 3.97 7.66 6.06 6.06M9.9 4.24C10.59 4.08 11.29 4 12 4C19 4 23 12 23 12C22.39 13.14 21.67 14.2 20.84 15.19M14.12 14.12C13.85 14.41 13.51 14.65 13.15 14.82C12.78 14.98 12.38 15.07 11.98 15.07C11.58 15.08 11.18 15.01 10.8 14.86C10.43 14.71 10.09 14.48 9.8 14.2C9.52 13.91 9.29 13.57 9.14 13.2C8.99 12.82 8.92 12.42 8.93 12.02C8.93 11.62 9.02 11.22 9.18 10.85C9.35 10.49 9.59 10.15 9.88 9.88M1 1L23 23"/>
            </svg>
          </button>
        </div>
        <p class="field__error"
           *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </p>
      </div>

      <div class="field">
        <label for="hotelId">Hotel ID</label>
        <input id="hotelId" type="text" formControlName="hotelId"
               class="input" placeholder="e.g. grand-hotel"
               autocomplete="organization" spellcheck="false" />
        <p class="field__error"
           *ngIf="loginForm.get('hotelId')?.invalid && loginForm.get('hotelId')?.touched">
          Hotel ID is required.
        </p>
      </div>

      <button type="submit" class="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Signing in…' : 'Sign in' }}
      </button>

      <div *ngIf="errorMessage" class="error-banner" role="alert">
        {{ errorMessage }}
      </div>

    </form>

    <footer class="login-card__footer">
      Secure hotel management platform
    </footer>

  </div>
</div>
