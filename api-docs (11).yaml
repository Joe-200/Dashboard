components:
  schemas:
    RateStayRequest:
      type: object
      properties:
        stars:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        notes:
          type: string
      required:
      - stars
    StayDetailsResponse:
      type: object
      properties:
        stayId:
          type: integer
          format: int64
        expectedCheckInDate:
          type: string
        checkInTime:
          type: string
        expectedCheckOutDate:
          type: string
        checkOutTime:
          type: string
        status:
          type: string
        stars:
          type: integer
          format: int32
        notes:
          type: string
        roomCharge:
          type: number
        totalCharge:
          type: number
        guestId:
          type: integer
          format: int64
        guestName:
          type: string
        guestPhone:
          type: string
        email:
          type: string
        nationality:
          type: string
        identification:
          type: string
        roomId:
          type: integer
          format: int64
        roomNumber:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        floor:
          type: integer
          format: int32
        description:
          type: string
        maxAdults:
          type: integer
          format: int32
        maxKids:
          type: integer
          format: int32
        numAdults:
          type: integer
          format: int32
        numKids:
          type: integer
          format: int32
    UpdateMenuItemRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          minimum: 0.0
        available:
          type: boolean
        category:
          type: string
          enum:
          - FOOD
          - DRINK
          - SERVICE
      required:
      - category
      - name
      - price
    MenuItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: number
        available:
          type: boolean
        imageUrl:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
